<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navidad-Admira</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/panel.css">
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.0/dist/apexcharts.min.js" integrity="sha384-0WpKazeVNul84+yFi1B+OXYKpb8vyWrdPCZifK8nsjTvMriWoZ49feLMvvPuIYaX" crossorigin="anonymous" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/sesion.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/tema.js" defer></script>
  <script src="js/dom.js" defer></script>
  <script src="js/categoria.js" defer></script>
  <script src="js/formulario.js" defer></script>
  <script src="js/resultados.js" defer></script>
  <script src="js/administracion.js" defer></script>
  <script src="js/usuarios.js" defer></script>
  <script src="js/dashboard.js" defer></script>
  <script src="js/panel.js" defer></script>
</head>
<body class="pagina-panel">
  <button id="boton-tema" class="boton-tema" type="button" aria-label="Cambiar a tema oscuro">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>
    </svg>
  </button>

  <header class="encabezado">
    <div>
      <p class="encabezado__marca">Posada de Navidad</p>
      <p class="encabezado__usuario">Hola, <span id="saludo"></span></p>
    </div>
    <button id="boton-salir" class="boton boton--secundario boton--chico" type="button">Cerrar sesión</button>
  </header>

  <div class="panel">
    <nav id="menu" class="menu" aria-label="Secciones"></nav>
    <main id="contenido" class="contenido"></main>
  </div>

  <p id="aviso" class="aviso" role="status" hidden></p>

  <dialog id="dialogo-propuesta" class="dialogo" aria-labelledby="titulo-dialogo">
    <form id="formulario-propuesta">
      <h2 id="titulo-dialogo"></h2>
      <div id="campos-propuesta" class="dialogo__campos"></div>
      <div class="campo campo--casilla">
        <input id="anonima" name="anonima" type="checkbox">
        <label for="anonima">Proponer de forma anónima</label>
      </div>
      <p class="ayuda">Los administradores siempre pueden ver quién propone.</p>
      <p id="mensaje-propuesta" class="mensaje" role="alert" hidden></p>
      <div class="dialogo__acciones">
        <button id="cancelar-propuesta" class="boton boton--secundario" type="button">Cancelar</button>
        <button class="boton" type="submit">Publicar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialogo-clave" class="dialogo" aria-labelledby="titulo-clave">
    <div class="dialogo__cuerpo">
      <h2 id="titulo-clave">Clave temporal</h2>
      <p id="clave-descripcion" class="ayuda"></p>
      <output id="clave-valor" class="clave-temporal"></output>
      <p class="ayuda">Se muestra una sola vez. Al cerrar esta ventana no se podrá volver a ver.</p>
      <div class="dialogo__acciones">
        <button id="copiar-clave" class="boton boton--secundario" type="button">Copiar</button>
        <button id="cerrar-clave" class="boton" type="button">Cerrar</button>
      </div>
    </div>
  </dialog>
</body>
</html>
